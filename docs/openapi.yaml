# Generated by `make apigen` from the Go types in backend/internal.
# Do not edit by hand: change the Go structs and regenerate.
openapi: 3.0.3
info:
  title: TikTok Carousel Studio API
  version: "1.0"
  description: |
    Session-cookie authenticated API. Every protected endpoint checks resource
    ownership, so a wrong id is a 404 rather than another user's data.
servers:
  - url: http://localhost:8080/api/v1
    description: local development
paths:
  /assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getAsset
      summary: One asset
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteAsset
      summary: Delete an asset
      responses:
        '204': {description: No content}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/config:
    get:
      operationId: getAuthConfig
      summary: Which sign-in methods are enabled
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/dev-login:
    post:
      operationId: devLogin
      summary: Sign in with an email address (development only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      operationId: logout
      summary: End the session
      responses:
        '204': {description: No content}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: The signed-in user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getCarousel
      summary: One carousel and its latest job
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarouselResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateCarousel
      summary: Rename or change status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCarouselRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carousel'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteCarousel
      summary: Soft-delete a carousel
      responses:
        '204': {description: No content}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/apply-brand:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: applyBrand
      summary: Re-stamp the project brand kit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarouselDesignView'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/archive:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: archiveCarousel
      summary: Archive a carousel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carousel'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/caption:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getCaption
      summary: Post caption and hashtags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarouselCaption'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateCaption
      summary: Edit the caption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaptionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarouselCaption'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/caption/generate:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: regenerateCaption
      summary: Rewrite the caption with AI
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarouselCaption'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/content:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getCarouselContent
      summary: The generated copy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDocument'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/design:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getDesign
      summary: The current Design JSON
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarouselDesignView'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: saveDesign
      summary: Autosave with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDesignRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarouselDesignView'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/duplicate:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: duplicateCarousel
      summary: Copy a carousel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carousel'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/export:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: createExport
      summary: Queue a PNG/ZIP export
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/regenerate:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: regenerateCarousel
      summary: Run generation again with the stored inputs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateCarouselResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/slides/{slideId}/images:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
      - name: slideId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getSlideImages
      summary: Image candidates for a slide
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCandidatesResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/slides/{slideId}/images/search:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
      - name: slideId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: searchSlideImages
      summary: Search again, optionally with a new keyword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchImagesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCandidatesResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/slides/{slideId}/images/select:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
      - name: slideId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: selectSlideImage
      summary: Use a candidate as the slide background
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectImageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectImageResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /carousels/{carouselId}/sources:
    parameters:
      - name: carouselId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getResearchSources
      summary: Sources cited during research
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /exports/{exportId}:
    parameters:
      - name: exportId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getExport
      summary: Export progress and download URL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getJob
      summary: Generation job progress
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects:
    get:
      operationId: listProjects
      summary: Every project the user owns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: createProject
      summary: Create a project from a niche description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getProject
      summary: One project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateProject
      summary: Update identity, brand kit or AI strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteProject
      summary: Soft-delete a project
      responses:
        '204': {description: No content}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/carousels:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listCarousels
      summary: Carousels in a project
      parameters:
        - name: q
          in: query
          required: false
          description: title search
          schema: {type: string}
        - name: status
          in: query
          required: false
          description: draft | ready | archived | all
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarouselsResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/carousels/generate:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: generateCarousel
      summary: Queue a carousel generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCarouselRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateCarouselResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/generate-schema:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: regenerateCarouselForm
      summary: Rebuild the input form
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{projectId}/schema:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getCarouselForm
      summary: The AI-generated input form
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /registry:
    get:
      operationId: getRegistry
      summary: Fonts, formulas, canvas presets and content languages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryResponse'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Asset:
      type: object
      required: [created_at, file_size, height, id, mime_type, source, user_id, width]
      properties:
        carousel_id:
          type: string
        created_at:
          type: string
          format: date-time
        file_size:
          type: integer
        height:
          type: integer
        id:
          type: string
        metadata:
          type: object
        mime_type:
          type: string
        project_id:
          type: string
        source:
          type: string
        source_id:
          type: string
        url:
          type: string
        user_id:
          type: string
        width:
          type: integer
    AuthConfigResponse:
      type: object
      required: [dev_login_enabled, google_enabled]
      properties:
        dev_login_enabled:
          type: boolean
        google_enabled:
          type: boolean
    AuthUser:
      type: object
      required: [avatar_url, created_at, email, id, name, provider]
      properties:
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time
        email:
          type: string
        id:
          type: string
        name:
          type: string
        provider:
          type: string
    Carousel:
      type: object
      required: [canvas_height, canvas_ratio, canvas_width, created_at, design_version, formula_id, id, platform, project_id, schema_version, status, title, updated_at]
      properties:
        canvas_height:
          type: integer
        canvas_ratio:
          type: string
        canvas_width:
          type: integer
        created_at:
          type: string
          format: date-time
        design_version:
          type: integer
        formula_id:
          type: string
        id:
          type: string
        input:
          type: object
        platform:
          type: string
        project_id:
          type: string
        schema_version:
          type: integer
        status:
          type: string
        thumbnail_url:
          type: string
        title:
          type: string
        updated_at:
          type: string
          format: date-time
    CarouselCaption:
      type: object
      required: [caption, edited, hashtags, updated_at]
      properties:
        caption:
          type: string
        edited:
          type: boolean
        generated_at:
          type: string
          format: date-time
          nullable: true
        hashtags:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    CarouselDesignView:
      type: object
      required: [design, version]
      properties:
        design:
          $ref: '#/components/schemas/Design'
        version:
          type: integer
    CarouselResponse:
      type: object
      required: [carousel]
      properties:
        carousel:
          $ref: '#/components/schemas/Carousel'
        job:
          $ref: '#/components/schemas/Job'
    CarouselsResponse:
      type: object
      required: [carousels]
      properties:
        carousels:
          type: array
          items:
            $ref: '#/components/schemas/Carousel'
    ContentDocument:
      type: object
      required: [formula_id, formula_reason, schema_version, slides, title]
      properties:
        formula_id:
          type: string
        formula_reason:
          type: string
        schema_version:
          type: string
        slides:
          type: array
          items:
            type: object
            required: [headline, index, role]
            properties:
              body:
                type: string
              headline:
                type: string
              image_intent:
                type: string
              image_query:
                type: string
              index:
                type: integer
              role:
                type: string
        title:
          type: string
    CreateProjectRequest:
      type: object
      required: [language, niche]
      properties:
        language:
          type: string
        niche:
          type: string
    Design:
      type: object
      required: [canvas, palette, slides, version]
      properties:
        canvas:
          $ref: '#/components/schemas/DesignCanvas'
        palette:
          $ref: '#/components/schemas/DesignPalette'
        slides:
          type: array
          items:
            $ref: '#/components/schemas/DesignSlide'
        version:
          type: string
    DesignCanvas:
      type: object
      required: [height, ratio, safe_area, width]
      properties:
        height:
          type: integer
        ratio:
          type: string
        reserved_bottom:
          type: integer
        reserved_top:
          type: integer
        safe_area:
          $ref: '#/components/schemas/DesignSafeArea'
        width:
          type: integer
    DesignElement:
      type: object
      required: [height, id, opacity, type, width, x, y, z]
      properties:
        asset_id:
          type: string
        content:
          type: string
        fill:
          type: string
        fit:
          type: string
        height:
          type: number
        id:
          type: string
        locked:
          type: boolean
        opacity:
          type: number
        overlay:
          $ref: '#/components/schemas/DesignOverlay'
        radius:
          type: number
        role:
          type: string
        shape:
          type: string
        style:
          $ref: '#/components/schemas/DesignStyle'
        type:
          type: string
        url:
          type: string
        width:
          type: number
        x:
          type: number
        y:
          type: number
        z:
          type: integer
    DesignOverlay:
      type: object
      required: [color, opacity]
      properties:
        color:
          type: string
        opacity:
          type: number
    DesignPalette:
      type: object
      required: [accent, background, primary, secondary, text]
      properties:
        accent:
          type: string
        background:
          type: string
        primary:
          type: string
        secondary:
          type: string
        text:
          type: string
    DesignPreset:
      type: object
      required: [height, label, ratio, width]
      properties:
        height:
          type: integer
        label:
          type: string
        ratio:
          type: string
        width:
          type: integer
    DesignSafeArea:
      type: object
      required: [height, width, x, y]
      properties:
        height:
          type: integer
        width:
          type: integer
        x:
          type: integer
        y:
          type: integer
    DesignSlide:
      type: object
      required: [background, elements, id, index, role]
      properties:
        background:
          type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/DesignElement'
        id:
          type: string
        image_intent:
          type: string
        image_query:
          type: string
        index:
          type: integer
        role:
          type: string
        template:
          type: string
    DesignStyle:
      type: object
      required: [color, fontFamily, fontSize, fontWeight, lineHeight, textAlign]
      properties:
        color:
          type: string
        fontFamily:
          type: string
        fontSize:
          type: number
        fontWeight:
          type: integer
        lineHeight:
          type: number
        textAlign:
          type: string
    DevLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        name:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
